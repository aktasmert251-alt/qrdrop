<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>QRDrop</title>
<meta name="description" content="File, photo and text transfer with no network, hotspot or Bluetooth — just a screen and a camera. / Ağ, hotspot ya da Bluetooth olmadan; yalnızca ekran ve kamerayla aktarım.">
<meta name="theme-color" content="#EDE9DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131410" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QRDrop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
</svg>

<!-- ANA SAYFA / HOME -->
<main class="view page" id="v-home">
  <header class="top">
    <div class="mark"><span class="mark-name">QRDROP</span><span class="mark-sub" data-i18n="tagline"></span></div>
    <button class="lang" data-lang type="button" aria-label="Dil / Language"></button>
  </header>

  <h1 class="hero" data-i18n="hero"></h1>

  <div class="modes">
    <button class="mode" id="go-send" type="button">
      <span class="mode-t" data-i18n="send"></span>
      <span class="mode-d" data-i18n="sendDesc"></span>
    </button>
    <button class="mode mode-alt" id="go-recv" type="button">
      <span class="mode-t" data-i18n="recv"></span>
      <span class="mode-d" data-i18n="recvDesc"></span>
    </button>
  </div>

  <section class="block">
    <h2 class="label" data-i18n="how"></h2>
    <ol class="steps">
      <li data-i18n-html="step1"></li>
      <li data-i18n-html="step2"></li>
      <li data-i18n-html="step3"></li>
    </ol>
  </section>

  <section class="block">
    <h2 class="label" data-i18n="received"></h2>
    <ul class="items" id="items"></ul>
  </section>

  <footer class="foot-note">
    <p class="state" id="offline-state"><i class="led"></i><span data-i18n="offlinePrep"></span></p>
    <button class="btn btn-sm" id="install" type="button" data-i18n="install" hidden></button>
    <p class="note" id="ios-hint" data-i18n="iosHint" hidden></p>
  </footer>
</main>

<!-- GÖNDERME HAZIRLIĞI / SEND SETUP -->
<main class="view page" id="v-setup" hidden>
  <header class="top">
    <button class="icon-btn" data-home type="button" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
    <span class="top-title" data-i18n="send"></span>
    <button class="lang" data-lang type="button" aria-label="Dil / Language"></button>
  </header>

  <section class="block">
    <h2 class="label" data-i18n="what"></h2>
    <div class="pickers">
      <button class="pick" id="pick-photo-btn" type="button"><svg class="ic"><use href="#i-photo"/></svg><span data-i18n="photo"></span></button>
      <button class="pick" id="pick-file-btn" type="button"><svg class="ic"><use href="#i-file"/></svg><span data-i18n="file"></span></button>
    </div>
    <input type="file" id="pick-photo" accept="image/*" hidden>
    <input type="file" id="pick-file" hidden>
    <textarea id="send-text" rows="3" maxlength="20000" data-i18n-ph="textPh"></textarea>
  </section>

  <section class="chosen" id="chosen" hidden>
    <img class="chosen-img" id="chosen-img" alt="" hidden>
    <div class="chosen-row">
      <span class="ext" id="chosen-ext"></span>
      <div class="chosen-info"><div class="chosen-name" id="chosen-name"></div><div class="chosen-size" id="chosen-size"></div></div>
      <button class="icon-btn" id="chosen-clear" type="button" data-i18n-aria="clear"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
  </section>

  <section class="block" id="opt-shrink" hidden>
    <h2 class="label" data-i18n="photoSize"></h2>
    <div class="seg" data-pref="shrink">
      <button type="button" data-v="1"><span data-i18n="shrink"></span><small data-i18n="shrinkSub"></small></button>
      <button type="button" data-v="0"><span data-i18n="original"></span><small data-i18n="originalSub"></small></button>
    </div>
  </section>

  <section class="block">
    <h2 class="label" data-i18n="density"></h2>
    <div class="seg" data-pref="density">
      <button type="button" data-v="kolay"><span data-i18n="easy"></span><small data-i18n="easySub"></small></button>
      <button type="button" data-v="normal"><span data-i18n="normal"></span><small data-i18n="normalSub"></small></button>
      <button type="button" data-v="hizli"><span data-i18n="fast"></span><small data-i18n="fastSub"></small></button>
    </div>
  </section>

  <section class="block">
    <h2 class="label" data-i18n="speed"></h2>
    <div class="seg" data-pref="fps">
      <button type="button" data-v="5">5<small data-i18n="fps"></small></button>
      <button type="button" data-v="8">8<small data-i18n="fps"></small></button>
      <button type="button" data-v="12">12<small data-i18n="fps"></small></button>
    </div>
  </section>

  <div class="go">
    <p class="estimate" id="estimate"></p>
    <button class="btn btn-accent btn-wide btn-lg" id="start" type="button" data-i18n="start" disabled></button>
    <button class="btn btn-wide btn-lg" id="start-scan" type="button" data-i18n="startScan" disabled></button>
    <p class="note" data-i18n="startNote"></p>
  </div>
</main>

<!-- GÖNDERİLİYOR / SENDING -->
<section class="view stage stage-send" id="v-send" hidden>
  <header class="send-top">
    <span class="send-name" id="send-name"></span>
    <span class="send-count" id="send-count"></span>
  </header>
  <div class="qr-wrap"><canvas id="qr" width="21" height="21" aria-label="QR"></canvas></div>
  <div class="send-ctrl">
    <p class="send-hint" data-i18n-html="sendHint"></p>
    <div class="seg seg-sm" data-pref="density" data-live>
      <button type="button" data-v="kolay" data-i18n="easy"></button>
      <button type="button" data-v="normal" data-i18n="normal"></button>
      <button type="button" data-v="hizli" data-i18n="fast"></button>
    </div>
    <div class="seg seg-sm" data-pref="fps" data-live>
      <button type="button" data-v="5">5<span data-i18n="fpsShort"></span></button>
      <button type="button" data-v="8">8<span data-i18n="fpsShort"></span></button>
      <button type="button" data-v="12">12<span data-i18n="fpsShort"></span></button>
    </div>
    <div class="row">
      <button class="btn" id="pause" type="button" data-i18n="pause"></button>
      <button class="btn btn-ink" id="stop" type="button" data-i18n="stop"></button>
    </div>
    <button class="swap" id="swap-to-recv" type="button" data-i18n="swapToRecv"></button>
  </div>
</section>

<!-- ALINIYOR / RECEIVING -->
<section class="view stage stage-recv" id="v-recv" hidden>
  <video id="cam" playsinline muted></video>
  <i class="aim" aria-hidden="true"></i>
  <button class="icon-btn recv-x" data-home type="button" data-i18n-aria="cancel"><svg class="ic"><use href="#i-close"/></svg></button>
  <div class="recv-panel">
    <div class="recv-line"><span id="recv-pct">%0</span><span id="recv-detail"></span></div>
    <div class="bar"><i id="recv-bar"></i></div>
    <p class="recv-hint" id="recv-hint"></p>
    <div class="recv-btns">
      <button class="swap swap-dark swap-strong" id="show-req" type="button" data-i18n="showReq"></button>
      <button class="swap swap-dark" id="swap-to-send" type="button" data-i18n="swapToSend"></button>
    </div>
  </div>
  <div class="req" id="req" hidden>
    <span class="req-tag" data-i18n="reqTag"></span>
    <h2 class="req-title" data-i18n="reqTitle"></h2>
    <div class="req-qr"><canvas id="req-qr" width="21" height="21" aria-label="QR"></canvas></div>
    <p class="req-text" data-i18n="reqText"></p>
    <button class="btn btn-ink btn-wide btn-lg" id="req-done" type="button" data-i18n="reqDone"></button>
  </div>
</section>

<!-- TAMAMLANDI / DONE -->
<main class="view page" id="v-done" hidden>
  <header class="top">
    <button class="icon-btn" data-home type="button" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
    <span class="top-title" id="done-title"></span>
  </header>
  <div class="done-view" id="done-view"></div>
  <div class="chosen-row done-row">
    <span class="ext" id="done-ext"></span>
    <div class="chosen-info"><div class="chosen-name" id="done-name"></div><div class="chosen-size" id="done-size"></div></div>
  </div>
  <div class="done-actions" id="done-actions"></div>
  <button class="btn btn-accent btn-wide btn-lg" id="again" type="button" data-i18n="again"></button>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
